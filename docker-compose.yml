services:
  nighty:
    build:
      context: .
      args:
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"
    image: nighty-linux-headless:latest
    container_name: nighty
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8088:8088"
    environment:
      TZ: "${TZ:-UTC}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      NIGHTY_BOX64_PROFILE: "${NIGHTY_BOX64_PROFILE:-balanced}"
      PYTHONIOENCODING: "${PYTHONIOENCODING:-utf-8}"
      SSL_CERT_FILE: "/etc/ssl/certs/ca-certificates.crt"
      SSL_CERT_DIR: "/etc/ssl/certs"
    secrets:
      - webui_username
      - webui_password
    volumes:
      # Mount your Nighty.exe (read-only)
      - ./Nighty.exe:/app/Nighty.exe:ro
      # Persist configuration and prefixes
      - ./data:/data
      # Mount dist directory for extensions persistence and write access
      - ./data/dist:/app/dist
      # Mount scripts and config so updates don't require rebuilding the image
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
    # Extra hosts handles the RP-fetch blackholing directly via Docker
    # This ensures lrclib.net doesn't freeze the bot under emulation
    extra_hosts:
      - "lrclib.net:0.0.0.0"
      - "api.lrclib.net:0.0.0.0"
      - "api.spotify.com:0.0.0.0"

secrets:
  webui_username:
    file: ./docker-secrets/webui_username
  webui_password:
    file: ./docker-secrets/webui_password
